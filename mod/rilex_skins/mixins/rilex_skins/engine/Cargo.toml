[package]
name = "rilex-skins-engine"
version = "0.1.0"
edition = "2024"
publish = false

# Only crates already in Horizon's Cargo.lock (horizon-mixins refuses anything else).
# ureq: no default features, so no gzip/flate2 pulled in a way the lock doesn't have.
[dependencies]
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
